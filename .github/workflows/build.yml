name: Build Quantum C

on:
  push:
    branches: [ master ]
    paths:
      - 'version.txt'

jobs:
  tag:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      outputs:
        version: ${{ steps.get_version.outputs.version }}
      steps:
        - uses: actions/checkout@v4
        
        - name: Get version
          id: get_version
          run: echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT
        
        - name: Create tag
          run: |
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag ${{ steps.get_version.outputs.version }}
            git push origin ${{ steps.get_version.outputs.version }}
  build-linux:
    needs: [tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Add LLVM repo
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
      - name: Install deps
        run: sudo apt install -y llvm-21 llvm-21-dev libffi-dev pkg-config cmake clang-21
      - name: Generate runtime.ll
        run: clang-21 -S -emit-llvm -O0 -o runtime.ll runtime.cpp
      - name: Build (Linux)
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release .
          cmake --build . -j$(nproc)
          mv qc qc-linux

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: qc-linux
          path: qc-linux

  build-macos:
    needs: [tag]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          brew install llvm@21 libffi cmake
          echo "LLVM_DIR=$(brew --prefix llvm@21)/lib/cmake/llvm" >> $GITHUB_ENV
          echo "$(brew --prefix llvm@21)/bin" >> $GITHUB_PATH
      - name: Generate runtime.ll
        run: clang -S -emit-llvm -O0 -I$(brew --prefix libffi)/include -o runtime.ll runtime.cpp
      - name: Build (macOS)
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=$LLVM_DIR .
          cmake --build . -j$(sysctl -n hw.logicalcpu)
          mv qc qc-macos

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          name: qc-macos
          path: qc-macos
  upload-extras:
    needs: [tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload stdlib
        uses: actions/upload-artifact@v4
        with:
          name: stdlib.qc
          path: stdlib.qc
      - name: Upload syntax
        uses: actions/upload-artifact@v4
        with:
          name: syntax.qc
          path: syntax.qc
      - name: Upload test
        uses: actions/upload-artifact@v4
        with:
          name: test.qc
          path: test.qc
  # windows not supported

  build-wasm:
    needs: [tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 'latest'
      
      - name: Build (WASM)
        run: emcc compiler.cpp compiler_run.cpp -o qc.js -std=c++20 -s WASM=1 -s FORCE_FILESYSTEM=1 -s EXPORTED_FUNCTIONS='["_run_quantum_code"]' -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' -s ALLOW_MEMORY_GROWTH=1 --preload-file stdlib.qc@/stdlib.qc -s STACK_SIZE=134217728 -s MODULARIZE=1 -s EXPORT_NAME="QuantumC" -s TOTAL_MEMORY=805306368 -s ASSERTIONS=2 -s SAFE_HEAP=1 -s NO_DISABLE_EXCEPTION_CATCHING -D__EMSCRIPTEN__
            
      - name: Upload WASM Files
        uses: actions/upload-artifact@v4
        with:
          name: qc-wasm
          path: |
            qc.js
            qc.wasm
            stdlib.qc
            qc.data  
  deploy-to-website:  
    needs: [build-wasm, tag]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: Youg-Otricked/learnhardcode
          token: ${{ secrets.PAT_TOKEN }}
          path: website
      
      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: qc-wasm
          path: ./wasm-files
      
      - name: Copy WASM files to website repo
        run: |
          cp wasm-files/qc.js website/QuantumC/
          cp wasm-files/qc.wasm website/QuantumC/
          cp wasm-files/stdlib.qc website/QuantumC/stdlib.qc
          cp wasm-files/qc.data website/QuantumC/
       
      - name: Commit and push to website repo
        run: |
          cd website
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add QuantumC/qc.js QuantumC/qc.wasm QuantumC/stdlib.qc QuantumC/qc.data
          git commit -m "Update Quantum C compiler [automated]" || echo "No changes to commit"
          git push
  release:
    needs: [tag, build-linux, build-macos, upload-extras]
    if: always() && needs.tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          files: |
            qc-linux/qc-linux
            qc-macos/qc-macos
            stdlib.qc/stdlib.qc